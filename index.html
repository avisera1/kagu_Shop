<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>匠木工 | 完全オーダーメイド木製家具</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#12100e;
  --text:#f4efe6;
  --muted:#c5b9a8;
  --gold:#d4af37;
}

body{
  margin:0;
  font-family:"Noto Serif JP", serif;
  background:
    radial-gradient(circle at top, rgba(212,175,55,.15), transparent 40%),
    #12100e;
  color:var(--text);
}

/* ヘッダー */
.site-header{
  position:sticky;
  top:0;
  background:rgba(20,16,12,.85);
  backdrop-filter:blur(12px);
  padding:16px 40px;
  display:flex;
  justify-content:space-between;
}

.brand{
  font-size:20px;
  letter-spacing:2px;
  font-weight:600;
}

/* ヒーロー */
.hero{
  text-align:center;
  padding:140px 20px;
  background:
    linear-gradient(90deg, rgba(10,8,6,.85), rgba(10,8,6,.35)),
    url("https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1800&q=80")
    center/cover no-repeat;
}

.hero h1{
  font-size:42px;
}

.hero p{
  color:#e0d6c7;
}

/* 森 */
.forest-story{
  margin:40px auto;
  max-width:1000px;
  padding:80px 20px;
  border-radius:28px;
  text-align:center;
  background:
    linear-gradient(90deg, rgba(40,30,20,.9), rgba(0,0,0,.5)),
    url("https://images.unsplash.com/photo-1448375240586-882707db888b")
    center/cover;
}

/* 共通 */
.section{
  padding:80px 20px;
  max-width:1000px;
  margin:auto;
}

.section h2{
  text-align:center;
}

/* サービス（家族背景） */
.services-section{
  padding:100px 20px;
  background:
    linear-gradient(90deg, rgba(0,0,0,.92), rgba(0,0,0,.45)),
    url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1800&q=80")
    center/cover;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:rgba(0,0,0,.5);
  padding:24px;
  border-radius:20px;
}

/* フォーム */
form{
  display:flex;
  flex-direction:column;
  gap:10px;
}

input,textarea{
  padding:10px;
  border-radius:10px;
  border:none;
}

button{
  background:var(--gold);
  border:none;
  padding:10px;
  border-radius:999px;
}

/* フッター */
footer{
  text-align:center;
  padding:40px;
  background:#0e0c0a;
}
</style>
</head>

<body>

<header class="site-header">
  <div class="brand">匠木工</div>
</header>

<section class="hero">
  <h1>家族とともに育つ家具</h1>
  <p>すべてを一から仕立てるオーダーメイド家具。</p>
</section>

<section class="forest-story">
  <h2>苗木から素材をつくる</h2>
  <p>お客様に合わせた素材を苗木から厳選。<br>
    お前は家具なるんだぞと5000年かけて家具にします。<br>
    立花山の苗木を使用しています。爆発することがあります。ご注意ください。
  </p>
</section>

<section class="section">
  <h2>私たちの想い</h2>
  <p style="text-align:center;">
    長く使える家具は、家族の時間を豊かにします。
  </p>
</section>

<section class="services-section">
  <div class="section">
    <h2>サービス</h2>
    <div class="cards">
      <div class="card">
        <h3>子供向け家具</h3>
        <p>成長に寄り添う設計。</p>
      </div>
      <div class="card">
        <h3>大人向け家具</h3>
        <p>上質な暮らしを演出。</p>
      </div>
      <div class="card">
        <h3>法人向け</h3>
        <p>空間価値を高める設計。</p>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <h2>お問い合わせ</h2>
  <form>
    <input placeholder="お名前">
    <input placeholder="メール">
    <textarea placeholder="内容"></textarea>
    <button>送信</button>
  </form>
</section>
<p style="text-align:center; color:var(--muted); margin-top:20px;">
  ※本社製品は、立花山の苗木を使用しています。<br
  >爆発することがあります。ご注意ください。
<footer>
  © 2026 匠木工
</footer>

</body>
</html>
