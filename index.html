<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匠木工 - 完全オーダーメイド家具</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>

<header id="header"></header>

<main>
  <section class="hero">
    <h1>完全オーダーメイド家具</h1>
    <p class="lead">子供向けから大人向け、法人向けまで、あなたの理想を実現します</p>
  </section>

  <section id="services" class="card">
    <h2>サービス</h2>
    <div class="grid">
      <a href="detail.html?id=kids" class="service-card">子供向け家具</a>
      <a href="detail.html?id=adult" class="service-card">大人向け家具</a>
      <a href="detail.html?id=corp" class="service-card">法人向け家具</a>
    </div>
  </section>

  <section id="contact" class="card">
    <h2>お問い合わせ</h2>
    <form action="https://formspree.io/f/yourID" method="POST">
      <input type="text" name="name" placeholder="名前" required>
      <input type="email" name="email" placeholder="メール" required>
      <textarea name="message" placeholder="内容"></textarea>
      <button type="submit">送信</button>
    </form>
  </section>

  <section class="card">
    <h2>アクセス</h2>
    <iframe src="https://www.google.com/maps?q=福岡市&output=embed" width="100%" height="300" border="0" allowfullscreen="" loading="lazy"></iframe>
  </section>
</main>

<footer id="footer"></footer>

<script src="src/js/loader.js"></script>
<script src="src/js/menu.js"></script>

</body>
</html>
