<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>匠木工 | 完全オーダーメイド木製家具</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#12100e;
  --text:#f4efe6;
  --muted:#c5b9a8;
  --gold:#d4af37;
  --gold-soft:#f6e3a1;
}

body{
  margin:0;
  font-family:"Noto Serif JP", serif;
  background:
    radial-gradient(circle at top, rgba(212,175,55,.15), transparent 40%),
    #12100e;
  color:var(--text);
}

/* ヘッダー */
.site-header{
  position:sticky;
  top:0;
  background:rgba(20,16,12,.85);
  backdrop-filter:blur(12px);
  padding:16px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:20px;
  letter-spacing:2px;
  font-weight:600;
}

/* ヒーロー（ここ強化） */
.hero{
  position:relative;
  text-align:center;
  padding:140px 20px;
  background:
    linear-gradient(90deg, rgba(10,8,6,.85), rgba(10,8,6,.35)),
    url("https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1800&q=80")
    center/cover no-repeat;
}

/* 上品な暗幕を追加 */
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,.2), rgba(0,0,0,.4));
}

.hero h1,
.hero p{
  position:relative;
  z-index:1;
}

.hero h1{
  font-size:42px;
  margin-bottom:20px;
  letter-spacing:1px;
}

.hero p{
  color:#e0d6c7;
  max-width:600px;
  margin:auto;
}

/* セクション */
.section{
  padding:80px 20px;
  max-width:1000px;
  margin:auto;
}

.section h2{
  text-align:center;
  margin-bottom:30px;
  font-weight:600;
}

/* カード */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:rgba(255,255,255,.04);
  padding:26px;
  border-radius:22px;
  transition:.3s;
  border:1px solid rgba(255,255,255,.08);
}

.card:hover{
  transform:translateY(-6px);
  background:rgba(255,255,255,.07);
  border-color:rgba(212,175,55,.3);
}

/* フォーム */
form{
  display:flex;
  flex-direction:column;
  gap:16px;
}

input, textarea{
  padding:12px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(0,0,0,.3);
  color:var(--text);
}

button{
  background:linear-gradient(145deg, var(--gold), #b8962e);
  border:none;
  padding:12px;
  border-radius:999px;
  cursor:pointer;
  font-weight:600;
}

/* フッター */
footer{
  text-align:center;
  padding:40px;
  background:#0e0c0a;
  color:var(--muted);
}

/* フェードイン */
.fade{
  opacity:0;
  transform:translateY(20px);
  animation:fade 1s forwards;
}
@keyframes fade{
  to{opacity:1; transform:none;}
}
</style>
</head>

<body>

<header class="site-header">
  <div class="brand">匠木工</div>
</header>

<section class="hero">
  <h1 class="fade">家族とともに育つ家具</h1>
  <p class="fade">
    子供の成長から、大人の暮らし、そして大切な空間まで。<br>
    すべてを一から仕立てるオーダーメイド家具。<br>
    苗木から大樹へ。匠木工は、あなたの暮らしに寄り添う家具をお届けします。
  </p>
</section>

<section class="section">
  <h2>私たちの想い</h2>
  <p style="text-align:center;">
    長く使える家具は、家族の時間を豊かにします。<br>
    匠木工では、暮らしに寄り添う家具を一つひとつ丁寧に制作しています。
  </p>
</section>

<section class="section">
  <h2>サービス</h2>
  <div class="cards">
    <div class="card">
      <h3>子供向け家具</h3>
      <p>安全で優しい設計。成長に合わせて長く使える家具。</p>
    </div>
    <div class="card">
      <h3>大人向け家具</h3>
      <p>上質で落ち着いた空間を作るオーダーメイド。</p>
    </div>
    <div class="card">
      <h3>法人向け</h3>
      <p>店舗・オフィスに最適なデザイン家具。</p>
    </div>
  </div>
</section>

<section class="section">
  <h2>お問い合わせ</h2>
  <form>
    <input type="text" placeholder="お名前">
    <input type="email" placeholder="メール">
    <textarea placeholder="ご相談内容"></textarea>
    <button>送信</button>
  </form>
</section>

<footer>
  © 2026 匠木工
</footer>

</body>
</html>
